services:
  postgres:
    image: postgres:17
    container_name: syncbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: syncbridge
      POSTGRES_USER: syncbridge
      POSTGRES_PASSWORD: syncbridge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncbridge -d syncbridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syncbridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncbridge-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000

volumes:
  postgres_data:
  redis_data: